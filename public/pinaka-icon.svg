<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="pinakaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>
  <!-- Celestial Bow Arch (Lord Shiva's Pinaka) -->
  <path d="M 25 10 C 70 20, 85 50, 85 50 C 85 50, 70 80, 25 90 C 35 65, 35 35, 25 10 Z" 
        stroke="url(#pinakaGlow)" stroke-width="3" fill="#06B6D4" fill-opacity="0.1" />
  <!-- Bowstring / Multi-sensor array line -->
  <line x1="25" y1="10" x2="25" y2="90" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.8" />
  <!-- Central Arrow & Radar Reticle Beam -->
  <line x1="15" y1="50" x2="90" y2="50" stroke="#00F0FF" stroke-width="2.5" />
  <polygon points="95,50 83,44 86,50 83,56" fill="#00F0FF" />
  <!-- Sensor concentric crosshairs -->
  <circle cx="50" cy="50" r="14" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
  <circle cx="50" cy="50" r="24" stroke="#3B82F6" stroke-width="1" opacity="0.4"/>
  <circle cx="50" cy="50" r="3" fill="#00F0FF" />
</svg>
