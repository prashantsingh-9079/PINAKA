services:
  - type: web
    name: pinaka-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: pinaka-postgres
          property: connectionString
      - key: SIMULATION_TICK_RATE_HZ
        value: "10"
      - key: CORS_ORIGINS
        value: '["*"]'
    autoDeploy: true

databases:
  - name: pinaka-postgres
    plan: free
    region: oregon
